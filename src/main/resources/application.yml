server:
  port: 8080

app:
  jwt:
    # HS256 签名密钥，至少 32 字节；生产环境通过环境变量 JWT_SECRET 注入
    secret: ${JWT_SECRET:dev-only-secret-please-change-me-32bytes-min}
    expire-minutes: 10080   # 7 天
  cors:
    # 开发期 Vite 可能占用 5173/5174/5175 等端口，默认放行本机任意端口；生产用环境变量覆盖
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*}

spring:
  application:
    name: spring-ai-demo
  datasource:
    # 本地 MySQL 占位配置，请按实际情况修改库名/账号/密码
    url: jdbc:mysql://localhost:3306/emoji_health_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
      deepseek:
        api-key:
        chat:
          options:
            model: deepseek-chat
            temperature: 0.4
            top-p: 0.8

mybatis-plus:
  # Mapper XML 文件位置（复杂 SQL 用）
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类包路径，用于类型别名
  type-aliases-package: com.example.chat.entity
  configuration:
    # 数据库下划线字段自动映射为驼峰属性，如 create_time -> createTime
    map-underscore-to-camel-case: true
    # 开发期打印执行的 SQL，上线可注释掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：数据库自增
      id-type: auto

logging:
  level:
    com.example.chat: debug
